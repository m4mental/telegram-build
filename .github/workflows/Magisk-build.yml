name: Build Magisk Modules

on:
  workflow_dispatch: # इसे आप मैन्युअली रन कर सकते हैं

permissions:
  contents: write

jobs:
  build-modules:
    runs-on: ubuntu-latest
    steps:
      # सीधे uni-apks का मुख्य कोड चेकआउट करेगा
      - name: Checkout uni-apks Repository
        uses: actions/checkout@v4
        with:
          repository: 'krvstek/uni-apks'

      # Morphe CLI के लिए Java 21 सेटअप करेगा
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies for configuration
        run: |
          pip install tomli-w

      - name: Configure config.toml for Magisk & Pitch Black Theme
        shell: python
        run: |
          import tomllib
          import tomli_w
          
          # Load existing config
          with open("config.toml", "rb") as f:
              config = tomllib.load(f)
          
          # Initialize new config with global settings
          allowed_global_keys = ["brand", "patches-source", "patches-version", "cli-source", "cli-version"]
          new_config = {k: v for k, v in config.items() if k in allowed_global_keys}
          
          # Dynamically search for youtube & youtube-music keys (ignoring case)
          for key, value in config.items():
              if isinstance(value, dict):
                  lower_key = key.lower()
                  # YouTube check (must contain youtube but not music)
                  if "youtube" in lower_key and "music" not in lower_key:
                      new_config[key] = value
                      new_config[key]["enabled"] = True
                      
                      # Exclude GmsCore support (microg) since it's a root build
                      exclude_list = new_config[key].get("exclude-patches", [])
                      if "GmsCore support" not in exclude_list:
                          exclude_list.append("GmsCore support")
                      new_config[key]["exclude-patches"] = exclude_list
                      
                      # Force Pitch Black Theme parameter
                      existing_args = new_config[key].get("patcher-args", "")
                      pitch_black_arg = "-O darkThemeBackgroundColor=@android:color/black"
                      if pitch_black_arg not in existing_args:
                          new_config[key]["patcher-args"] = f"{existing_args} {pitch_black_arg}".strip()
                          
                  # YouTube Music check (matches 'Music', 'YouTube Music', 'YouTube-Music', etc.)
                  elif "music" in lower_key:
                      new_config[key] = value
                      new_config[key]["enabled"] = True
                      
                      # Exclude GmsCore support
                      exclude_list = new_config[key].get("exclude-patches", [])
                      if "GmsCore support" not in exclude_list:
                          exclude_list.append("GmsCore support")
                      new_config[key]["exclude-patches"] = exclude_list
                      
                      # Force Pitch Black Theme parameter
                      existing_args = new_config[key].get("patcher-args", "")
                      pitch_black_arg = "-O darkThemeBackgroundColor=@android:color/black"
                      if pitch_black_arg not in existing_args:
                          new_config[key]["patcher-args"] = f"{existing_args} {pitch_black_arg}".strip()
          
          # Save back modified config
          with open("config.toml", "wb") as f:
              tomli_w.dump(new_config, f)
          
          print("Modified config.toml successfully with Dynamic Keys and Pitch Black Theme!")

      - name: Install UV (Python Package Manager used by uni-apks)
        uses: astral-sh/setup-uv@v3

      - name: Run Patcher Script
        run: |
          uv run main.py

      - name: Build Unified Magisk Module ZIP
        run: |
          # Create build directory for magisk
          mkdir -p magisk_out
          
          # Check if compiled APKs exist
          YT_APK=$(find build -iname "*youtube*.apk" ! -iname "*music*" | head -n 1)
          YTM_APK=$(find build -iname "*music*.apk" -o -iname "*youtube-music*.apk" | head -n 1)
          
          if [ -z "$YT_APK" ] || [ -z "$YTM_APK" ]; then
            echo "Error: One of the required APKs was not compiled!"
            exit 1
          fi
          
          # Extract versions
          YT_VER=$(echo "$YT_APK" | grep -oP 'v[0-9]+\.[0-9]+\.[0-9]+' | sed 's/v//' || echo "1.0.0")
          YTM_VER=$(echo "$YTM_APK" | grep -oP 'v[0-9]+\.[0-9]+\.[0-9]+' | sed 's/v//' || echo "1.0.0")
          
          # Setup single unified module folder
          mkdir -p bundle_temp
          
          # Write module.prop (Unified details)
          cat <<EOF > bundle_temp/module.prop
          id=youtube-music-morphe-bundle
          name=YouTube & YT Music Morphe Bundle
          version=YT v$YT_VER | YTM v$YTM_VER
          versionCode=$(date +%Y%m%d)
          author=Morphe / krvstek
          description=Systemless YouTube and YouTube Music with default Pitch Black Theme. Automatically handles installation/downgrade. Works with or without stock apps.
          EOF
          
          # Copy APKs to the module root temporarily
          cp "$YT_APK" bundle_temp/com.google.android.youtube.apk
          cp "$YTM_APK" bundle_temp/com.google.android.apps.youtube.music.apk
          
          # Write customize.sh (यह "जादुई जुगाड़" स्क्रिप्ट है जो सब कुछ हैंडल करेगी)
          cat <<'EOF' > bundle_temp/customize.sh
          # Define package names
          YT_PKG="com.google.android.youtube"
          YTM_PKG="com.google.android.apps.youtube.music"
          
          # Helper function to map device paths to Magisk system paths
          get_magisk_mount_path() {
              local target_dir="$1"
              if [[ "$target_dir" == /system/* ]]; then
                  echo "$MODPATH$target_dir"
              else
                  echo "$MODPATH/system$target_dir"
              fi
          }
          
          # 1. Uninstall any existing user updates to prevent signature issues
          ui_print "- Removing conflicting user updates..."
          pm uninstall $YT_PKG >/dev/null 2>&1
          pm uninstall $YTM_PKG >/dev/null 2>&1
          
          # --- YouTube Installation ---
          if [ "$BOOTMODE" != "true" ]; then
              # Recovery Mode fall-back
              ui_print "- Installing YouTube to default system path (Recovery)..."
              mkdir -p "$MODPATH/system/product/app/YouTube"
              cp "$MODPATH/com.google.android.youtube.apk" "$MODPATH/system/product/app/YouTube/YouTube.apk"
          else
              YT_PATH=$(pm path $YT_PKG | head -n 1 | cut -d: -f2)
              if [ -n "$YT_PATH" ]; then
                  YT_DIR=$(dirname "$YT_PATH")
                  ui_print "- Stock YouTube found at: $YT_DIR"
                  MOUNT_DIR=$(get_magisk_mount_path "$YT_DIR")
                  mkdir -p "$MOUNT_DIR"
                  cp "$MODPATH/com.google.android.youtube.apk" "$MOUNT_DIR/base.apk"
              else
                  ui_print "- Stock YouTube not found. Creating new system app..."
                  mkdir -p "$MODPATH/system/product/app/YouTube"
                  cp "$MODPATH/com.google.android.youtube.apk" "$MODPATH/system/product/app/YouTube/YouTube.apk"
              fi
          fi
          
          # --- YouTube Music Installation ---
          if [ "$BOOTMODE" != "true" ]; then
              # Recovery Mode fall-back
              ui_print "- Installing YT Music to default system path (Recovery)..."
              mkdir -p "$MODPATH/system/product/app/YouTubeMusic"
              cp "$MODPATH/com.google.android.apps.youtube.music.apk" "$MODPATH/system/product/app/YouTubeMusic/YouTubeMusic.apk"
          else
              YTM_PATH=$(pm path $YTM_PKG | head -n 1 | cut -d: -f2)
              if [ -n "$YTM_PATH" ]; then
                  YTM_DIR=$(dirname "$YTM_PATH")
                  ui_print "- Stock YT Music found at: $YTM_DIR"
                  MOUNT_DIR=$(get_magisk_mount_path "$YTM_DIR")
                  mkdir -p "$MOUNT_DIR"
                  cp "$MODPATH/com.google.android.apps.youtube.music.apk" "$MOUNT_DIR/base.apk"
              else
                  ui_print "- Stock YT Music not found. Creating new system app..."
                  mkdir -p "$MODPATH/system/product/app/YouTubeMusic"
                  cp "$MODPATH/com.google.android.apps.youtube.music.apk" "$MODPATH/system/product/app/YouTubeMusic/YouTubeMusic.apk"
              fi
          fi
          
          # Clean up temporary APKs from root
          rm -f "$MODPATH/com.google.android.youtube.apk"
          rm -f "$MODPATH/com.google.android.apps.youtube.music.apk"
          ui_print "- Package cleanup complete!"
          EOF
          
          # Create ZIP of the entire bundle
          cd bundle_temp
          zip -r ../magisk_out/YouTube-Music-Morphe-Bundle.zip .
          cd ..
          
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: "morphe-magisk-${{ github.run_number }}"
          name: "YouTube & YT Music Morphe Magisk Module Bundle"
          body: |
            Unified Magisk/KernelSU Module for YouTube & YT Music.
            
            - Automatically uninstalls play store updates during flash to avoid signature issues.
            - Automatically installs apps as system apps if they are missing.
            - Default Theme: Pitch Black Theme enabled.
          files: |
            magisk_out/YouTube-Music-Morphe-Bundle.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
